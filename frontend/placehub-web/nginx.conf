server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Text assets are compressed on the fly (woff2 and PDFs are already compressed).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hashed assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # The self-hosted font is not content-hashed; cache it for 30 days.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # SPA routing: unknown paths fall back to index.html (React Router renders the 404 page).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "DENY";
    }
}
