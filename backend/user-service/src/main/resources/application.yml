server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: user-service
  datasource:
    url: ${USERS_DB_URL}
    username: ${USERS_DB_USER}
    password: ${USERS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

placehub:
  security:
    jwt-secret: ${JWT_SECRET:}
    internal-token: ${INTERNAL_SERVICE_TOKEN:}
    public-paths:
      - /api/auth/**
  jwt:
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  recruiter:
    auto-approve: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Liveness never depends on Kafka, Mongo, DB or Eureka: a dependency outage must not get the JVM restarted.
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
